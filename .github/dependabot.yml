version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /apps/web
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
