[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aryn"
version = "0.1.0"
description = "ARYN — Autonomous Agent Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.18,<5",
    "httpx>=0.24",
    "fastapi>=0.100",
    "sqlalchemy>=2.0",
    "alembic>=1.10",
    "uvicorn>=0.30",
    "authlib>=1.6,<2",
    "PyJWT[crypto]>=2.10,<3"
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2"]
runtime = ["aiohttp>=3.14", "urllib3>=2.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.14", "build>=1.2", "pip-audit>=2.9", "psycopg[binary]>=3.2", "PyYAML>=6", "setuptools==84.0.0", "wheel>=0.45"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "packages*", "database*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["postgresql: live PostgreSQL verification; explicit connection is mandatory when selected"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness first. Import ordering/modernization/style remain a documented backlog.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# These entry points must install the isolated runtime path before importing it.
"scripts/hermes-9router.py" = ["E402"]
"tests/hermes_gateway_check.py" = ["E402"]
