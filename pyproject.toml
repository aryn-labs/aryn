[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aryn"
version = "0.1.0"
description = "ARYN — Autonomous Agent Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.18,<5",
    "httpx>=0.24",
    "fastapi>=0.100",
    "sqlalchemy>=2.0",
    "alembic>=1.10",
    "uvicorn>=0.30",
    "authlib>=1.6,<2",
    "PyJWT[crypto]>=2.10,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "packages*", "database*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
